[package]
name = "bot_core"
version = "0.1.0"
description = "Alpha Bot Core - shared bot registry and vault logic"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "bot_core"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = "0.30.1"
anchor-spl = "0.30.1"
alpha-shared = { path = "../../shared" }
