<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    body {
      margin: 0; width: 280px; background: #05070A; color: #F5F7FA;
      font-family: "IBM Plex Mono", ui-monospace, Menlo, monospace; font-size: 11px;
    }
    header {
      padding: 12px 14px; border-bottom: 1px solid #151B22;
      display: flex; align-items: center; gap: 10px;
    }
    .logo {
      width: 28px; height: 28px; background: #3d9eff; color: #05070A;
      font-weight: 700; font-size: 11px; display: flex; align-items: center;
      justify-content: center; border-radius: 4px;
    }
    .sub { color: #4A5560; font-size: 9px; letter-spacing: 0.06em; margin-top: 2px; }
    main { padding: 12px 14px; }
    p { color: #7D8794; line-height: 1.5; margin: 0 0 10px; }
    a {
      display: block; text-align: center; padding: 10px; background: #3d9eff;
      color: #05070A; text-decoration: none; font-weight: 600; font-size: 11px;
      letter-spacing: 0.04em; border-radius: 4px;
    }
    ul { margin: 0; padding-left: 16px; color: #7D8794; line-height: 1.6; }
  </style>
</head>
<body>
  <header>
    <div class="logo">SB</div>
    <div>
      <div>SOLBIT</div>
      <div class="sub">EXTENSION · SOLANA</div>
    </div>
  </header>
  <main>
    <p>On X and DexScreener:</p>
    <ul>
      <li>CAs are highlighted — click to copy</li>
      <li>Hover for live token card</li>
      <li>Open Desk in SOLBIT terminal</li>
    </ul>
    <p style="margin-top:14px">Solana only. No fabricated data.</p>
    <a href="https://alpha-solana-terminal.vercel.app/" target="_blank">OPEN TERMINAL</a>
  </main>
</body>
</html>
